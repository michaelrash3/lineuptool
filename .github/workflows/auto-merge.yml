# Auto-merges Claude-authored PRs once all checks pass, so changes prepared in
# Claude Code land on `main` without a manual merge step.
#
# Scope (intentionally conservative):
#   - Only PRs whose head branch starts with `claude/` AND that come from a
#     branch in THIS repo (not a fork). Anything else is ignored.
#   - Merges only when the `build-and-test` CI job (typecheck + lint + tests +
#     build + audit, see ci.yml) has succeeded AND every other check run and
#     commit status (e.g. the Vercel deployment) on the head commit is green.
#   - Drafts are NOT held: a green claude/* PR is promoted out of draft (if
#     needed) and squash-merged hands-off. There is no manual "Ready for
#     review" gate.
#   - EXCEPT when the PR asks to be held (see "Holding a PR" below). Green CI
#     proves the tests pass; it cannot prove the tests test anything. PRs #582-
#     #585 each merged while adversarial review was still in flight, and #582
#     shipped nine high-severity integrity bugs behind a fully green run.
#
# Holding a PR:
#   Add the `do-not-merge` label, or put `do-not-merge` on a line of its own in
#   the PR body (an HTML comment, `<!-- do-not-merge -->`, works and stays
#   invisible in the rendered description — for agents that cannot set labels).
#   Either one blocks BOTH the un-draft and the merge; nothing else about the
#   workflow changes. Remove the label / delete the line to release, and the
#   next trigger or the 15-minute sweep merges it normally. If the label API
#   call fails the PR is treated as held: a merge that waits costs a sweep
#   interval, a merge that shouldn't have happened costs a revert in prod.
#   Documented in docs/CONTRIBUTING.md.
#
# Triggers: CI completion (workflow_run), PR events, check_suite, status — plus
# a 15-minute cron. Every trigger runs the same "re-scan all open claude/* PRs"
# loop, so the cron needs no logic of its own; it exists because GitHub's event
# delivery is best-effort. On PR #576 the workflow_run CI-completion event was
# never delivered and a fully green PR sat unmerged until a human intervened.
# The timer bounds that failure to one sweep interval. (Cron runs the copy of
# this file on `main`, not the one on a PR branch — fine, since the sweep is
# repo-wide.)
#
# To pause it entirely, disable this workflow in the repo's Actions tab (or
# delete the file); that stops the cron sweep too. To hold a specific PR, use
# the `do-not-merge` hold above.

name: Auto-merge Claude PRs

on:
  # Reliable trigger: fires when the CI workflow finishes. Unlike check_suite,
  # workflow_run IS delivered even though CI runs under GITHUB_TOKEN (GitHub
  # suppresses check_suite/status-style triggers from token-generated events,
  # which is why auto-merge previously only fired off the third-party Vercel
  # status and raced CI).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  status: {}
  # Self-healing sweep for events GitHub never delivered (see header). Cheap:
  # one API-only job, seconds long, and a no-op when nothing is mergeable.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  # listLabelsOnIssue is an ISSUES endpoint. Declaring a permissions block
  # sets every unlisted scope to `none`, and the hold below fails safe — so if
  # that call 403s, EVERY pull request reads as held and auto-merge stops
  # repo-wide. One line to remove the only plausible path to that outage.
  issues: read

concurrency:
  # A scheduled run has no PR or check_suite payload, so it would fall through
  # to github.sha — the default-branch head, shared with every event-driven run
  # on main. Give the sweep its own fixed key instead: sweeps still serialize
  # against each other (never two merge loops at once), but a sweep and a
  # CI-triggered run don't queue behind one another.
  group: automerge-${{ github.event_name == 'schedule' && 'sweep' || github.event.pull_request.number || github.event.check_suite.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const HEAD_PREFIX = "claude/";
            const CI_CHECK = "build-and-test"; // job name in ci.yml
            const SELF_CHECK = "automerge";    // this job — never wait on itself
            const HOLD_LABEL = "do-not-merge"; // author-set hold; see header

            // The same token on a line of its own in the PR body, for authors
            // (agents, mostly) that can open a PR but not label it. Anchored to
            // a whole line so prose that merely mentions the label does not
            // trip it, and tolerant of an HTML-comment wrapper so the marker
            // can be invisible in the rendered description. A false positive
            // here only delays a merge, which is the safe direction.
            const HOLD_MARKER = /^[ \t]*(?:<!--[ \t]*)?do-not-merge[ \t]*(?:-->)?[ \t]*$/im;

            // Re-scan ALL open same-repo claude/* PRs on every trigger rather
            // than trusting the event payload's PR list. The check_suite event
            // often delivers an empty pull_requests array, and a Vercel `status`
            // event that arrives before CI finishes would otherwise be the last
            // word — both leave a mergeable PR stuck as a draft. Re-scanning on
            // any trigger (incl. check_suite.completed when CI turns green)
            // makes the merge reliable.
            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const numbers = openPrs
              .filter(
                (p) =>
                  p.head.ref.startsWith(HEAD_PREFIX) &&
                  p.head.repo?.full_name === `${owner}/${repo}`
              )
              .map((p) => p.number);
            if (numbers.length === 0) { core.info("No open claude/* PRs."); return; }

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const tag = `PR #${number}`;

              if (pr.state !== "open") { core.info(`${tag}: not open — skip.`); continue; }
              if (!pr.head.ref.startsWith(HEAD_PREFIX)) { core.info(`${tag}: head '${pr.head.ref}' not '${HEAD_PREFIX}*' — skip.`); continue; }
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) { core.info(`${tag}: from a fork — skip.`); continue; }

              const sha = pr.head.sha;
              const combined = (await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })).data;
              const statusesOk = combined.total_count === 0 || combined.state === "success";

              const runs = (await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })).data
                .check_runs.filter(r => r.name !== SELF_CHECK);
              const ok = c => ["success", "neutral", "skipped"].includes(c);
              const ciPassed = runs.some(r => r.name === CI_CHECK && r.status === "completed" && r.conclusion === "success");
              const anyPending = runs.some(r => r.status !== "completed");
              const anyFailed = runs.some(r => r.status === "completed" && !ok(r.conclusion));

              if (!ciPassed || anyPending || anyFailed || !statusesOk) {
                core.info(`${tag}: not mergeable yet (ciPassed=${ciPassed}, pending=${anyPending}, failed=${anyFailed}, statuses=${combined.state}).`);
                continue;
              }

              // Author hold. Deliberately evaluated HERE — after the checks are
              // known green, immediately before the un-draft/merge — and from a
              // fresh API read rather than the `pulls.get` payload above, so a
              // label applied while CI was still running is seen by the very run
              // that would otherwise merge. (Everything upstream of this point is
              // read-only, so a late hold still costs nothing.)
              let heldBecause = null;
              try {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 100,
                });
                // An unlabelled PR answers 200 with [] — that is "not held", not
                // a failure, so the normal path never wedges. Only a thrown error
                // means we could not determine the hold state.
                if (labels.some(l => (l.name || "").trim().toLowerCase() === HOLD_LABEL)) {
                  heldBecause = `the '${HOLD_LABEL}' label`;
                }
              } catch (e) {
                // Fail safe: a merge that waits costs one sweep interval, a merge
                // that shouldn't have happened costs a revert in production.
                heldBecause = `a failed label lookup (${e.status || ""} ${e.message}) — treating as held`;
              }
              if (!heldBecause && HOLD_MARKER.test(pr.body || "")) {
                heldBecause = `the '${HOLD_LABEL}' marker in the PR body`;
              }
              if (heldBecause) {
                // warning, not info: a persistent API failure holds every PR
                // forever, and that is precisely the outage that goes
                // unnoticed when it is logged at info level with no annotation.
                core.warning(`${tag}: held by ${heldBecause} — not un-drafting, not merging.`);
                continue;
              }

              // No draft hold beyond the one above. GitHub refuses to merge a
              // draft via the API, so promote it out of draft first (GraphQL
              // markPullRequestReadyForReview),
              // then squash-merge. A green claude/* PR therefore lands hands-off
              // whether or not a human ever clicked "Ready for review".
              if (pr.draft) {
                try {
                  await github.graphql(
                    `mutation($id:ID!){ markPullRequestReadyForReview(input:{pullRequestId:$id}){ pullRequest { id } } }`,
                    { id: pr.node_id }
                  );
                  core.info(`${tag}: promoted out of draft.`);
                } catch (e) {
                  core.warning(`${tag}: could not mark ready — ${e.status || ""} ${e.message}`);
                  continue;
                }
              }

              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: "squash" });
                core.info(`${tag}: squash-merged. ✅`);
              } catch (e) {
                core.warning(`${tag}: merge failed — ${e.status || ""} ${e.message}`);
              }
            }
