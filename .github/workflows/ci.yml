# Runs the app's typecheck, lint, unit tests (Vitest), and production build
# (Vite) on pushes to feature branches. Mirrors the local pre-push checks in
# docs/CONTRIBUTING.md. The existing deploy-firestore-rules workflow stays
# separate — it only touches rules on pushes to main.
#
# Trigger is push-only (no pull_request): for a same-repo branch, the push
# event already runs CI and GitHub shows that check on any PR for the same head
# commit, so adding pull_request would only fire a second, redundant run that
# concurrency then cancels — leaving a noisy "cancelled" check. Push-only keeps
# exactly one run per commit. (A fork PR wouldn't get CI this way; not a concern
# for this private single-repo project.)

name: CI

on:
  push:
    branches-ignore:
      - main

# Cancel superseded runs on the same branch so a quick re-push doesn't queue
# redundant builds.
concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The firebase-tools version the emulator-backed rules tests run on. Kept in
  # lockstep with the pin in deploy-firestore-rules.yml so the rules validated
  # here are validated by the same binary that deploys them.
  FIREBASE_TOOLS_VERSION: "15.26.0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the build on new high/critical production advisories. Dev-server
      # toolchain advisories do not ship in the Vite production bundle, so keep
      # this gate focused on runtime dependencies.
      - name: Security audit
        # npm's bulk-advisory endpoint intermittently returns a malformed
        # (gzip-mangled) body — "invalid json response body ... is not valid
        # JSON" — and plain `npm audit` exits 1 for that, indistinguishably
        # from a real advisory. A security gate that goes red on registry
        # flakiness is one people learn to re-run past, which is exactly how a
        # genuine advisory gets waved through. So separate the two failures:
        # retry the transport, fail only on advisories we could actually read,
        # and warn (without blocking) when the endpoint never answers.
        run: |
          for attempt in 1 2 3; do
            out=""
            if ! out=$(npm audit --json --omit=dev 2>/tmp/audit.err); then
              : # non-zero also means "advisories found" — decided by the JSON below
            fi
            if printf '%s' "$out" | jq -e 'has("metadata")' >/dev/null 2>&1; then
              high=$(printf '%s' "$out" | jq '.metadata.vulnerabilities.high // 0')
              crit=$(printf '%s' "$out" | jq '.metadata.vulnerabilities.critical // 0')
              if [ "$((high + crit))" -gt 0 ]; then
                echo "::error::npm audit: $crit critical, $high high production advisories"
                printf '%s' "$out" | jq -r '.vulnerabilities | to_entries[]
                  | select(.value.severity == "high" or .value.severity == "critical")
                  | "  \(.value.severity)\t\(.key)"'
                exit 1
              fi
              echo "Security audit clean: 0 high, 0 critical production advisories."
              exit 0
            fi
            echo "Attempt $attempt: audit endpoint returned an unreadable response."
            cat /tmp/audit.err || true
            sleep $((attempt * 5))
          done
          echo "::warning::npm audit could not complete after 3 attempts (registry returned an unreadable response). Not failing the build on an infrastructure error — this does NOT mean the audit passed."

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Prettier is the pinned formatter (docs/CONTRIBUTING.md). --check fails
      # the build on any unformatted file so style stays uniform without manual
      # nitpicking; run `npm run format` locally to fix.
      - name: Format check
        run: npm run format:check

      # --bail=1 stops at the first failing test so a broken run goes red fast
      # (auto-merge gates on this job; no value in grinding through 800 more
      # tests once one has failed). Local `npm test` stays full-run for debugging.
      - name: Unit tests
        run: npm test -- --bail=1

      # The auto-merge workflow decides what lands on main without a human;
      # its hold logic is executed from the real YAML by workflow-tests/, so
      # an edit to the workflow that regresses the hold fails CI here.
      - name: Workflow-script tests
        run: npm run test:workflows
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: true

      # A green build says nothing about WHAT shipped. jspdf, recharts and
      # qrcode are all dynamically imported today; this fails the run if one
      # lands back in the eager startup graph, or if that graph outgrows its
      # byte ceiling (scripts/check-bundle.mjs documents the number).
      - name: Bundle budget
        run: npm run check:bundle

  # Firestore security-rule tests (firestore-tests/rules.test.ts) run against
  # the Firestore emulator, so they need a Java runtime + firebase-tools and
  # can't ride inside the pure-jsdom unit suite. A separate job keeps the
  # toolchain isolated and runs in parallel with build-and-test. Auto-merge
  # gates on every check run on the head commit, so a rules regression here
  # blocks the merge even though build-and-test stays the named CI gate.
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # PINNED, deliberately not @latest. On 2026-08-05 npm tagged
      # firebase-tools 15.26.0 `latest` while its tarball still 404'd, so
      # every job doing an @latest install failed for ~20 minutes — including
      # the PRODUCTION rules deploy, which left a just-merged rules change
      # undeployed (see deploy-firestore-rules.yml). An unpinned install makes
      # an upstream publish a dependency of this repo's CI being green.
      # Bump this deliberately, together with the deploy workflow's pin.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Firestore rules tests
        run: npm run test:rules
        env:
          CI: true
